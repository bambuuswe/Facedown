name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build for iPhone without signing
        run: |
          xcodebuild build \
            -project Facedown.xcodeproj \
            -scheme Facedown \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Facedown.app Payload/
          zip -qry Facedown.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Facedown-unsigned-ipa
          path: Facedown.ipa
